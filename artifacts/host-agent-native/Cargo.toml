[package]
name = "host-agent-native"
version = "0.1.0"
edition = "2021"
description = "DecentralHub native capture/encode module (DXGI + NVENC POC)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
