    post:
      operationId: authRefresh
      tags: [auth]
      summary: Rotate refresh cookie and mint a new access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional body fallback when cookie is unavailable
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
