        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing hostToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/speedtest:
    post:
      operationId: hostSpeedtestUpload
      tags: [hosts]
      summary: Upload speed test — agent POSTs binary payload
      description: Requires X-Host-Token or X-Token header.
      security:
        - HostToken: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Speed measured
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  uploadMbps:
                    type: ["integer", "null"]
                required: [ok]
        "400":
          description: Missing host token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/speedtest/download:
    get:
      operationId: hostSpeedtestDownload
      tags: [hosts]
      summary: Download speed test — server sends binary payload
      description: Requires X-Host-Token or X-Token header. Query `bytes` (64 KiB–2 MiB, default 512 KiB).
      security:
        - HostToken: []
      parameters:
        - in: query
          name: bytes
          required: false
          schema:
            type: integer
            minimum: 65536
            maximum: 2097152
      responses:
        "200":
          description: Binary payload for throughput measurement
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing host token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

