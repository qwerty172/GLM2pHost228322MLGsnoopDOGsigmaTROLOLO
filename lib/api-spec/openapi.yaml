openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: P2P Cloud Gaming signaling, session, and wallet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: hosts
    description: Host registration and management
  - name: players
    description: Player registration and wallet identity
  - name: sessions
    description: Session lifecycle and discovery
  - name: wallet
    description: Crypto wallet, balances, deposits, withdrawals
  - name: games
    description: Catalog of games available to stream
  - name: quotas
    description: Quota preset-contracts (royalty / sponsor) attachable to sessions
  - name: loans
    description: P2P loan marketplace (request, fund, repay)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /hosts/register:
    post:
      operationId: registerHost
      tags: [hosts]
      summary: Register a new host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterHostBody"
      responses:
        "201":
          description: Host registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"

  /hosts/{hostToken}:
    get:
      operationId: getHost
      tags: [hosts]
      summary: Look up host by token
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/config:
    patch:
      operationId: updateHostConfig
      tags: [hosts]
      summary: Update the host's offer config (binding, pricing, schedule, restream)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostConfigBody"
      responses:
        "200":
          description: Updated host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/sessions:
    get:
      operationId: listHostSessions
      tags: [hosts]
      summary: List sessions for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/stats:
    get:
      operationId: getHostStats
      tags: [hosts]
      summary: Aggregate stats for a host (sessions, minutes streamed, earnings)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStats"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/activity:
    get:
      operationId: getHostActivity
      tags: [hosts]
      summary: Recent activity feed for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts:
    get:
      operationId: listPublicHosts
      tags: [hosts]
      summary: Public list of currently-available hosts
      description: Returns hosts that have an open session and are within their availability schedule. Safe for anonymous visitors — never exposes hostToken or wallet/balance.
      responses:
        "200":
          description: Live hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHostListItem"

  /stats:
    get:
      operationId: getPublicStats
      tags: [health]
      summary: Public platform stats for the landing page
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /players/register:
    post:
      operationId: registerPlayer
      tags: [players]
      summary: Register a new player wallet identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerBody"
      responses:
        "201":
          description: Player registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{playerToken}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Look up player by token
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the games catalog with live-session counts
      parameters:
        - in: query
          name: hasMods
          required: false
          schema:
            type: boolean
          description: Only return games tagged as supporting mods
        - in: query
          name: isMultiplayer
          required: false
          schema:
            type: boolean
          description: Only return multiplayer games
        - in: query
          name: hostSpectatesPlayer
          required: false
          schema:
            type: boolean
          description: Only return games where the host watches the player's session
        - in: query
          name: hasQuests
          required: false
          schema:
            type: boolean
          description: Only return games that support paid quests
        - in: query
          name: liveOnly
          required: false
          schema:
            type: boolean
          description: Only return games that have at least one live session right now
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against the game title
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: Only return games that have at least one currently-available host whose capability tags contain this value (case-insensitive).
        - in: query
          name: includeHidden
          required: false
          schema:
            type: boolean
          description: When true and the caller is an admin (X-Host-Token), hidden games are included in the results.
      responses:
        "200":
          description: Games catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameListItem"

  /games/{slug}:
    get:
      operationId: getGameBySlug
      tags: [games]
      summary: Game detail with currently-live sessions
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: When set, only live hosts whose capability tags contain this value are returned.
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetail"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/browser-host:
    post:
      operationId: createBrowserHostSession
      tags: [sessions]
      summary: |
        Create a session whose host is the calling browser (no desktop agent).
        Returns both the session and the freshly minted hostToken — the caller
        is responsible for storing the hostToken locally and using it to
        connect to /signal as role=host and to end the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserHostSessionBody"
      responses:
        "201":
          description: Browser-host session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBrowserHostSessionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game or player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}:
    get:
      operationId: getSessionByPlayerToken
      tags: [sessions]
      summary: Get a session by its player token (used by player share link)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}/claim:
    post:
      operationId: claimSession
      tags: [sessions]
      summary: Claim a session by linking it to a player's wallet (enables billing)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSessionBody"
      responses:
        "200":
          description: Session claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request (insufficient balance, already claimed, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/end:
    patch:
      operationId: endSession
      tags: [sessions]
      summary: End an active session (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionBody"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/preview:
    post:
      operationId: createPreviewSession
      tags: [sessions]
      summary: |
        Mint a short-lived preview token (60-second TTL) for a 30-second
        free muted live stream from the given host. No session record is
        created and no billing occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId]
              properties:
                hostId:
                  type: string
                  description: UUID of the host to preview
      responses:
        "200":
          description: Preview token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  previewToken:
                    type: string
                  hostId:
                    type: string
        "400":
          description: hostId missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Host offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas:
    get:
      operationId: listPublicQuotas
      tags: [quotas]
      summary: List public quotas, with optional filters
      parameters:
        - in: query
          name: kind
          required: false
          schema:
            type: string
            enum: [royalty, sponsor]
        - in: query
          name: gameId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public quotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quota"
    post:
      operationId: createQuota
      tags: [quotas]
      summary: Create a draft quota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotaBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/mine:
    get:
      operationId: listMyQuotas
      tags: [quotas]
      summary: List quotas owned by the calling user
      parameters:
        - in: query
          name: ownerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: My quotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quota"
        "404":
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/applied:
    get:
      operationId: listAppliedQuotas
      tags: [quotas]
      summary: Quotas that have been applied to sessions where the caller is host or player
      parameters:
        - in: query
          name: ownerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Applied quotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quota"
        "404":
          description: Owner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/match-my-host:
    get:
      operationId: matchQuotasForHost
      tags: [quotas]
      summary: Quotas compatible with the host's PC specs, sorted by profitability
      parameters:
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matched quotas, best first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quota"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/current-quota:
    get:
      operationId: getHostCurrentQuota
      tags: [hosts]
      summary: Returns the quota attached to the host's current active session (if any)
      parameters:
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current quota or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  quota:
                    nullable: true
                    $ref: "#/components/schemas/Quota"
                  sessionId:
                    type: string
                required:
                  - quota
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/attach-quota:
    post:
      operationId: attachQuotaToSession
      tags: [hosts]
      summary: Attach a quota to the host's current active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostToken:
                  type: string
                quotaId:
                  type: string
              required:
                - hostToken
                - quotaId
      responses:
        "200":
          description: Quota attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sessionId:
                    type: string
                  quotaId:
                    type: string
                required:
                  - ok
        "404":
          description: Host or session or quota not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session already has a different quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/detach-quota:
    post:
      operationId: detachQuotaFromSession
      tags: [hosts]
      summary: Detach the current quota from the host's active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostToken:
                  type: string
              required:
                - hostToken
      responses:
        "200":
          description: Quota detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sessionId:
                    type: string
                required:
                  - ok
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/applicable:
    get:
      operationId: listApplicableQuotas
      tags: [quotas]
      summary: Quotas a host can attach to a new session (own + public-for-game + optional private code)
      parameters:
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
        - in: query
          name: gameId
          required: false
          schema:
            type: string
        - in: query
          name: accessCode
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Applicable quotas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quota"

  /quotas/{id}:
    get:
      operationId: getQuota
      tags: [quotas]
      summary: Quota detail + owner-only summary
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: ownerToken
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateQuota
      tags: [quotas]
      summary: Edit a quota (only allowed before publish and before any movement)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotaBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "400":
          description: Cannot edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/{id}/publish:
    post:
      operationId: publishQuota
      tags: [quotas]
      summary: Move draft → active (locks sponsor escrow)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaOwnerBody"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "400":
          description: Insufficient escrow / invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/{id}/pause:
    post:
      operationId: pauseQuota
      tags: [quotas]
      summary: Pause an active quota
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaOwnerBody"
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"

  /quotas/{id}/close:
    post:
      operationId: closeQuota
      tags: [quotas]
      summary: Close a quota and refund any remaining escrow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaOwnerBody"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"

  /quotas/ai-suggest-specs:
    post:
      operationId: aiSuggestQuotaSpecs
      tags: [quotas]
      summary: Use AI to suggest minimum PC specs for a game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestQuotaSpecsBody"
      responses:
        "200":
          description: Suggested specs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestQuotaSpecsResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quotas/{id}/regenerate-code:
    post:
      operationId: regenerateQuotaCode
      tags: [quotas]
      summary: Mint a new access code for a private quota
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaOwnerBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"

  /quotas/ai-chat:
    post:
      operationId: quotaAiChat
      tags: [quotas]
      summary: AI assistant chat for filling / editing a quota form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotaAiChatBody"
      responses:
        "200":
          description: AI reply and optional form patch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaAiChatResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Wallet overview — balance, deposit addresses, withdrawal history
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
          description: Either a host token or a player token
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: Recent wallet transactions (deposits, withdrawals, billing)
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}/withdraw:
    post:
      operationId: requestWithdrawal
      tags: [wallet]
      summary: Submit a withdrawal request (queued for processing)
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWithdrawalBody"
      responses:
        "201":
          description: Withdrawal queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid request (e.g. insufficient balance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/games:
    get:
      operationId: adminListGames
      tags: [games]
      summary: Admin — list all games including hidden ones
      parameters:
        - in: header
          name: X-Host-Token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameListItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/requests:
    get:
      operationId: listLoanRequests
      tags: [loans]
      summary: List open P2P loan requests (newest first)
      responses:
        "200":
          description: Open loan requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoanRequest"
    post:
      operationId: createLoanRequest
      tags: [loans]
      summary: Create a new P2P loan request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequestBody"
      responses:
        "201":
          description: Loan request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Pledger limit is zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/requests/{id}/fund:
    post:
      operationId: fundLoanRequest
      tags: [loans]
      summary: Fund an open loan request (lender side)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundLoanRequestBody"
      responses:
        "201":
          description: Loan funded and created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundLoanResponse"
        "400":
          description: Insufficient balance or request not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/mine:
    get:
      operationId: listMyLoans
      tags: [loans]
      summary: List caller's loans as borrower and as lender
      parameters:
        - in: query
          name: userToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: My loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLoans"
        "400":
          description: userToken required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/{id}/repay:
    post:
      operationId: repayLoan
      tags: [loans]
      summary: Repay (partial or full) a loan as the borrower
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepayLoanBody"
      responses:
        "200":
          description: Repayment applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepayLoanResponse"
        "400":
          description: Insufficient balance or invalid loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/games/{id}:
    patch:
      operationId: adminPatchGame
      tags: [games]
      summary: Admin — edit game metadata and/or toggle is_hidden flag
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Host-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPatchGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteGame
      tags: [games]
      summary: Admin — permanently delete a game with no session history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Host-Token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: string
                required: [deleted, id]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot delete — sessions exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    AdminPatchGameBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        category:
          type: string
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        coverImageUrl:
          type: string
        steamAppId:
          type: ["string", "null"]
        hasMods:
          type: boolean
        isMultiplayer:
          type: boolean
        hostSpectatesPlayer:
          type: boolean
        hasQuests:
          type: boolean
        browserHostUrl:
          type: string
        isHidden:
          type: boolean
          description: Set to true to hide from public catalog; false to restore visibility.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ScheduleSlot:
      type: object
      description: A single weekly availability window (UTC).
      properties:
        day:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday
        startMin:
          type: integer
          minimum: 0
          maximum: 1440
        endMin:
          type: integer
          minimum: 0
          maximum: 1440
      required:
        - day
        - startMin
        - endMin

    Host:
      type: object
      properties:
        id:
          type: string
        hostToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: Синий — internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Зелёный — LZT convertible back to crypto at 200:1
        gameId:
          type: ["string", "null"]
          description: Catalog game this host is bound to
        boundAppPath:
          type: string
          description: Absolute Windows path to the .exe the agent will launch
        boundUrl:
          type: string
          description: URL of a browser game the agent will open. When set, takes precedence over boundAppPath.
        boundAppLabel:
          type: string
          description: Friendly label shown in the games library
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Capability tags shown as badges and used as library filters
        launchPriceUsd:
          type: number
          description: Charged once when a player joins (may be negative)
        minutePriceUsd:
          type: number
          description: Charged per minute while streaming (may be negative)
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
          description: e.g. "twitch", "youtube", "rtmp"
        streamUrl:
          type: string
        streamKeySet:
          type: boolean
          description: True if a stream key is stored. The key itself is never returned.
        creditMinutesPerNewPlayer:
          type: integer
          description: Host service credit policy — minutes of play extended on credit to new players who run out mid-session. 0 disables auto-credit.
        creditMaxLztPerPlayer:
          type: integer
          description: Per-borrower cap on host service credit, in LZT.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        hostTier:
          type: string
          enum: [below_min, meets_min, above_rec]
          description: Quick general strength badge vs the site-wide baseline hardware profile (not tied to a specific quota)
      required:
        - id
        - hostToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - gameId
        - boundAppPath
        - boundUrl
        - boundAppLabel
        - description
        - tags
        - launchPriceUsd
        - minutePriceUsd
        - scheduleMode
        - scheduleJson
        - streamPlatform
        - streamUrl
        - streamKeySet
        - creditMinutesPerNewPlayer
        - creditMaxLztPerPlayer
        - createdAt
        - lastSeenAt

    UpdateHostConfigBody:
      type: object
      description: Partial update — omit a field to leave it unchanged.
      properties:
        gameId:
          type: ["string", "null"]
        boundAppPath:
          type: string
        boundUrl:
          type: string
          description: URL of a browser game; mutually exclusive with boundAppPath at runtime.
        boundAppLabel:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
        streamUrl:
          type: string
        streamKey:
          type: string
          description: Pass empty string to clear the stored key.
        creditMinutesPerNewPlayer:
          type: integer
          minimum: 0
          maximum: 1440
          description: "Host service credit policy. When > 0, this host extends short-term in-game credit to new players who run out of LZT mid-session, up to this many minutes of play. Set to 0 to disable."
        creditMaxLztPerPlayer:
          type: integer
          minimum: 0
          description: |
            Maximum LZT this host will credit to any single borrower. Acts as a
            per-borrower cap on host service credit.

    Player:
      type: object
      properties:
        id:
          type: string
        playerToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: Синий — internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Зелёный — LZT convertible back to crypto at 200:1
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - playerToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - createdAt
        - lastSeenAt

    RegisterHostBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    RegisterPlayerBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    GameListItem:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        coverImageUrl:
          type: string
        description:
          type: string
        genre:
          type: string
        hasMods:
          type: boolean
        isMultiplayer:
          type: boolean
        hostSpectatesPlayer:
          type: boolean
        hasQuests:
          type: boolean
        liveSessionCount:
          type: integer
          description: Number of pending or active sessions matching this game right now
        browserHostUrl:
          type: string
          description: |
            Same-origin URL of a vendored browser build that a player can host
            directly from their browser tab (no desktop agent). Empty when only
            native-app hosting is supported.
        isHidden:
          type: boolean
          description: When true the game is excluded from the public catalog (admin-only flag).
      required:
        - id
        - slug
        - title
        - coverImageUrl
        - description
        - genre
        - hasMods
        - isMultiplayer
        - hostSpectatesPlayer
        - hasQuests
        - liveSessionCount
        - browserHostUrl

    GameLiveSession:
      type: object
      properties:
        playerToken:
          type: string
          description: Player share token — visit /play/{playerToken} to join
        appName:
          type: string
        ratePerMinute:
          type: number
        resolution:
          type: string
        bitrateKbps:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        hostDisplayName:
          type: string
        boundAppLabel:
          type: string
        boundUrl:
          type: string
          description: When set, the agent opens this URL instead of launching an .exe.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
      required:
        - playerToken
        - appName
        - ratePerMinute
        - resolution
        - bitrateKbps
        - status
        - createdAt
        - hostDisplayName
        - boundAppLabel
        - boundUrl
        - description
        - tags
        - launchPriceUsd
        - minutePriceUsd
        - scheduleMode
        - scheduleJson
        - streamPlatform

    GameDetail:
      allOf:
        - $ref: "#/components/schemas/GameListItem"
        - type: object
          properties:
            liveSessions:
              type: array
              items:
                $ref: "#/components/schemas/GameLiveSession"
          required:
            - liveSessions

    Session:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        playerToken:
          type: string
        claimedByPlayerId:
          type: ["string", "null"]
        appName:
          type: string
        status:
          type: string
          description: One of pending, active, ended
        resolution:
          type: string
        bitrateKbps:
          type: integer
        ratePerMinute:
          type: number
          description: Player credits charged per minute (host receives net of commission)
        paymentSource:
          type: string
          enum: [blue, green, auto]
        quotaId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        endReason:
          type: ["string", "null"]
          description: Why the session ended. One of player_ended, host_ended, balance_exhausted, host_offline, block_expired.
        blockMinutes:
          type: ["integer", "null"]
          description: Block size in minutes chosen at session start (10, 15, or 25). Null means unlimited per-minute billing.
        blockReservedLzt:
          type: ["integer", "null"]
          description: Total LZT reserved for the block at session start. Unused reserve is refunded on early exit.
      required:
        - id
        - hostId
        - playerToken
        - appName
        - status
        - resolution
        - bitrateKbps
        - ratePerMinute
        - createdAt

    EndSessionBody:
      type: object
      properties:
        hostToken:
          type: string
      required:
        - hostToken

    ClaimSessionBody:
      type: object
      properties:
        playerWalletToken:
          type: string
          description: The player's wallet token (issued via /players/register)
        paymentSource:
          type: string
          enum: [blue, green, auto]
          description: |
            Which LZT bucket the player wants to pay from. "auto" prefers
            зелёный (withdrawable) and falls back to синий (internal).
      required:
        - playerWalletToken

    CreateBrowserHostSessionBody:
      type: object
      description: |
        The calling browser (identified by playerWalletToken) wants to host
        the given game itself, by loading its vendored build into an iframe
        and capturing the canvas via WebRTC. The server mints a fresh host
        row owned by this player and returns its hostToken.
      properties:
        playerWalletToken:
          type: string
        gameSlug:
          type: string
      required:
        - playerWalletToken
        - gameSlug

    CreateBrowserHostSessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/Session"
        hostToken:
          type: string
          description: Use to authenticate as the host on /signal and to end the session.
        browserHostUrl:
          type: string
          description: Same-origin URL to load in the host page's iframe.
      required:
        - session
        - hostToken
        - browserHostUrl

    CreateSessionBody:
      type: object
      properties:
        hostToken:
          type: string
        appName:
          type: string
        resolution:
          type: string
        bitrateKbps:
          type: integer
        ratePerMinute:
          type: number
        paymentSource:
          type: string
          enum: [blue, green, auto]
        quotaId:
          type: ["string", "null"]
          description: Optional quota preset-contract to attach to this session.
        quotaAccessCode:
          type: string
          description: Required when attaching a private quota the host does not own.
      required:
        - hostToken
        - appName

    HostStats:
      type: object
      properties:
        totalSessions:
          type: integer
        activeSessions:
          type: integer
        totalMinutesStreamed:
          type: integer
        lifetimeEarnings:
          type: number
        earnings7d:
          type: number
        internalBalanceLzt:
          type: integer
        withdrawableBalanceLzt:
          type: integer
      required:
        - totalSessions
        - activeSessions
        - totalMinutesStreamed
        - lifetimeEarnings
        - earnings7d
        - internalBalanceLzt
        - withdrawableBalanceLzt

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - kind
        - title
        - timestamp

    DepositAddress:
      type: object
      properties:
        currency:
          type: string
          description: "USDT_TRC20 | NANO | SOL"
        label:
          type: string
        address:
          type: string
        network:
          type: string
        minDeposit:
          type: number
      required:
        - currency
        - label
        - address
        - network
        - minDeposit

    Withdrawal:
      type: object
      properties:
        id:
          type: string
        ownerType:
          type: string
        ownerId:
          type: string
        currency:
          type: string
        address:
          type: string
        amountUsdt:
          type: number
          description: Amount in crypto USDT-equivalent (LZT / 200)
        amountLzt:
          type: integer
        status:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - ownerType
        - ownerId
        - currency
        - address
        - amountUsdt
        - amountLzt
        - status
        - requestedAt

    RequestWithdrawalBody:
      type: object
      properties:
        currency:
          type: string
        address:
          type: string
        amountLzt:
          type: integer
          description: Amount in LZT (must be a multiple of 200 — i.e. whole USDT)
      required:
        - currency
        - address
        - amountLzt

    Wallet:
      type: object
      properties:
        ownerType:
          type: string
          description: "host | player"
        ownerId:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: Legacy alias of balanceLzt (синий, internal LZT).
        withdrawableBalanceLzt:
          type: integer
          description: Legacy alias of cashLzt (зелёный, withdrawable LZT).
        balanceLzt:
          type: integer
          description: Синий — internal LZT, earns weekly interest, pays internal services & premium.
        cashLzt:
          type: integer
          description: Зелёный — convertible to crypto at 200:1 and withdrawable.
        creditLimitLzt:
          type: integer
          description: Gaming credit line in LZT (default 3000 = $15). Player can play past zero balance up to this limit.
        creditDebtLzt:
          type: integer
          description: Aggregate outstanding principal across all loans where the user is the borrower.
        creditReceivableLzt:
          type: integer
          description: Aggregate outstanding principal owed *to* the user as a lender.
        premiumUntil:
          type: ["string", "null"]
          format: date-time
          description: Premium subscription end (ISO 8601). null when no premium.
        lifetimeDepositUsdtCents:
          type: integer
          description: Lifetime deposit volume in USDT cents — drives the tariff tier.
        pendingWithdrawalsLzt:
          type: integer
        lztPerUsdt:
          type: integer
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        recentWithdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
      required:
        - ownerType
        - ownerId
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - balanceLzt
