          required: true
          schema:
            type: string
          description: Bearer host token
      responses:
        "200":
          description: Current pairing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPairingStatusResponse"
        "401":
          description: Host token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/agent-pair:
    post:
      operationId: agentPair
      tags: [auth]
      summary: Agent submits a 6-digit pairing code and receives hostToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPairBody"
      responses:
        "200":
          description: Paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPairResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or expired pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /agent-telemetry:
    post:
      operationId: postAgentTelemetry
      tags: [auth]
      summary: Host agent pushes noteworthy events (startup, fatal errors, injector failures)
      parameters:
        - in: header
          name: X-Host-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTelemetryBody"
      responses:
        "200":
          description: Events stored
          content:
            application/json:
              schema:
                type: object
                required: [ok, stored]
                properties:
                  ok:
                    type: boolean
                  stored:
                    type: integer
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Host token required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dev-keys:
    post:
      operationId: createDevKey
      tags: [dev]
      summary: Mint a developer API key and LZT wallet
      parameters:
        - in: header
          name: X-Dev-Key-Secret
          schema:
            type: string
          description: Shared secret (or X-Admin-Secret / admin host token)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevKeyCreateBody"
      responses:
        "201":
          description: Dev key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevKeyResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dev-keys/{apiKey}/rules:
    patch:
      operationId: patchDevKeyRules
      tags: [dev]
      summary: Update host-selection rules, status, or display name for a dev key
      parameters:
        - in: path
          name: apiKey
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevKeyPatchBody"
      responses:
        "200":
          description: Updated dev key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevKeySummary"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for object upload
      security:
        - HostToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Upload URL issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or unknown host token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/confirm:
    post:
      operationId: confirmUpload
      tags: [storage]
      summary: Confirm a cover upload and set public ACL
      security:
        - HostToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmUploadBody"
      responses:
        "200":
          description: Upload confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmUploadResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or unknown host token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/me/saves/{gameId}:
    get:
      operationId: getPlayerGameSave
      tags: [players]
      summary: Get latest cloud save metadata for a game
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Save metadata or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerGameSaveResponse"

  /players/me/saves/{gameId}/upload-url:
    post:
      operationId: requestPlayerGameSaveUploadUrl
      tags: [players]
      summary: Request presigned upload URL for a cloud save archive
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerGameSaveUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerGameSaveUploadUrlResponse"

  /players/me/saves/{gameId}/commit:
    post:
      operationId: commitPlayerGameSave
      tags: [players]
      summary: Finalize cloud save after upload
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerGameSaveCommitBody"
      responses:
        "200":
          description: Save committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerGameSaveCommitResponse"


components:
  securitySchemes:
    HostToken:
      type: apiKey
      in: header
      name: X-Host-Token
      description: Host authentication token
    UserToken:
      type: apiKey
      in: header
      name: X-User-Token
      description: Unified host-or-player wallet token (loans, premium, quotas)
    PlayerToken:
      type: apiKey
      in: header
      name: X-Player-Token
      description: Player authentication token
    BearerAuth:
      type: http
      scheme: bearer
      description: Host bearer token (Authorization header)
  schemas:
    SaveUploadUrlBody:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        sizeBytes:
          type: integer
          description: Save archive size in bytes (max 500 MB)
      required:
        - sessionId
        - sizeBytes

    SaveUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath

    SaveDownloadUrlResponse:
      type: object
      properties:
        downloadURL:
          type: string
        objectPath:
          type: string
      required:
        - downloadURL
        - objectPath

    SaveConfirmBody:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        contentHash:
          type: string
          description: SHA-256 hex digest of the uploaded archive
        sizeBytes:
          type: integer
      required:
        - sessionId
        - contentHash
        - sizeBytes

    SaveConfirmResponse:
      type: object
      properties:
        saved:
          type: boolean
        objectPath:
          type: string
      required:
        - saved
        - objectPath

    PlayerGameSaveUploadUrlBody:
      type: object
      properties:
        sizeBytes:
          type: integer
      required: [sizeBytes]

    PlayerGameSaveUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        storageKey:
          type: string
        sizeBytes:
          type: integer
      required: [uploadURL, storageKey, sizeBytes]

    PlayerGameSaveCommitBody:
      type: object
      properties:
        storageKey:
          type: string
        sizeBytes:
          type: integer
        version:
          type: integer
      required: [storageKey, sizeBytes]

    PlayerGameSaveCommitResponse:
      type: object
      properties:
        ok:
          type: boolean
        save:
          type: object
          additionalProperties: true
      required: [ok]

    PlayerGameSaveResponse:
      type: object
      properties:
        save:
          type: ["object", "null"]
          additionalProperties: true
      required: [save]



    ExchangeJoinCodeResponse:
      type: object
      properties:
        playerToken:
          type: string
          description: Long-lived session token — store in memory, never put back in the URL
        sessionId:
          type: string
          format: uuid
      required:
        - playerToken
        - sessionId


    GameSubmissionItem:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        status:
          type: string
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        coverImageUrl:
          type: string
        kind:
          type: string
        defaultBrowserUrl:
          type: string
        steamAppId:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        rejectionReason:
          type: ["string", "null"]
        approvedGameId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        submitterDisplayName:
          type: string
      required:
        - id
        - hostId
        - status
        - title
        - slug
        - category
        - genres
        - description
        - coverImageUrl
        - kind
        - defaultBrowserUrl
        - createdAt
        - submitterDisplayName

    AdminApproveSubmissionBody:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        category:
          type: string
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        coverImageUrl:
          type: string
        steamAppId:
          type: string

    AdminApproveSubmissionResponse:
      type: object
      properties:
        approved:
          type: boolean
        game:
          $ref: "#/components/schemas/GameListItem"
        libraryAutoCreated:
          type: boolean
      required:
        - approved
        - game

    AdminRejectSubmissionBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
        - reason

    AdminRejectSubmissionResponse:
      type: object
      properties:
        rejected:
          type: boolean
      required:
        - rejected

    AdminPatchGameBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        category:
          type: string
        genres:
          type: array
          items:
            type: string
        description:
          type: string
        coverImageUrl:
          type: string
        steamAppId:
          type: ["string", "null"]
        hasMods:
          type: boolean
        isMultiplayer:
          type: boolean
        hostSpectatesPlayer:
          type: boolean
        hasQuests:
          type: boolean
        browserHostUrl:
          type: string
        isHidden:
          type: boolean
          description: Set to true to hide from public catalog; false to restore visibility.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ScheduleSlot:
      type: object
      description: A single weekly availability window (UTC).
      properties:
        day:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday вЂ¦ 6 = Saturday
        startMin:
          type: integer
          minimum: 0
          maximum: 1440
        endMin:
          type: integer
          minimum: 0
          maximum: 1440
      required:
        - day
        - startMin
        - endMin

    Host:
      type: object
      properties:
        id:
          type: string
        hostToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: РЎРёРЅРёР№ вЂ” internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Р—РµР»С‘РЅС‹Р№ вЂ” LZT convertible back to crypto at 200:1
        gameId:
          type: ["string", "null"]
          description: Catalog game this host is bound to
        boundAppPath:
          type: string
          description: Absolute Windows path to the .exe the agent will launch
        boundUrl:
          type: string
          description: URL of a browser game the agent will open. When set, takes precedence over boundAppPath.
        boundAppLabel:
          type: string
          description: Friendly label shown in the games library
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Capability tags shown as badges and used as library filters
        launchPriceUsd:
          type: number
          description: Charged once when a player joins (may be negative)
        minutePriceUsd:
          type: number
          description: Charged per minute while streaming (may be negative)
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
          description: e.g. "twitch", "youtube", "rtmp"
        streamUrl:
          type: string
        streamKeySet:
          type: boolean
          description: True if a stream key is stored. The key itself is never returned.
        creditMinutesPerNewPlayer:
          type: integer
          description: Host service credit policy вЂ” minutes of play extended on credit to new players who run out mid-session. 0 disables auto-credit.
        creditMaxLztPerPlayer:
          type: integer
          description: Per-borrower cap on host service credit, in LZT.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        hostTier:
          type: string
          enum: [below_min, meets_min, above_rec]
          description: Quick general strength badge vs the site-wide baseline hardware profile (not tied to a specific quota)
        scheduleAutoDisabledReason:
          type: ["string", "null"]
          description: Set by the schedule watchdog when it auto-deactivated this host's schedule due to a missed wake-up window. Null once cleared by the hoster saving config again.
        scheduleAutoDisabledAt:
          type: ["string", "null"]
          format: date-time
        lastSubmissionStatus:
          type: ["string", "null"]
          description: Latest game submission outcome (pending / approved / rejected)
        lastSubmissionNote:
          type: string
          description: Human-readable note about the last submission outcome
        gamesContributed:
          type: integer
          description: Count of approved catalog submissions from this host
        isAdmin:
          type: boolean
          description: Platform administrator flag
        agentKeyBound:
          type: boolean
          description: True when an Ed25519 agent public key is bound (key itself is never returned)
        pcSpecs:
          type: ["object", "null"]
          description: PC hardware specs reported by the host agent
          properties:
            gpu:
              type: string
            cpu:
              type: string
            ramGb:
              type: number
            cpuCores:
              type: number
            downloadMbps:
              type: number
            uploadMbps:
              type: number
        pingMs:
          type: ["integer", "null"]
          description: RTT from host agent to API (ms), null until first measured heartbeat
        ratingAvg:
          type: ["number", "null"]
        ratingCount:
          type: integer
      required:
        - id
        - hostToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - gameId
        - boundAppPath
        - boundUrl
        - boundAppLabel
        - description
        - tags
        - launchPriceUsd
        - minutePriceUsd
        - scheduleMode
        - scheduleJson
        - streamPlatform
        - streamUrl
        - streamKeySet
        - creditMinutesPerNewPlayer
        - creditMaxLztPerPlayer
        - createdAt
        - lastSeenAt
        - hostTier
        - scheduleAutoDisabledReason
        - scheduleAutoDisabledAt
        - lastSubmissionStatus
        - lastSubmissionNote
        - gamesContributed
        - isAdmin
        - agentKeyBound
        - pcSpecs

    UpdateHostConfigBody:
      type: object
      description: Partial update вЂ” omit a field to leave it unchanged.
      properties:
        gameId:
          type: ["string", "null"]
        boundAppPath:
          type: string
        boundUrl:
          type: string
          description: URL of a browser game; mutually exclusive with boundAppPath at runtime.
        boundAppLabel:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
        streamUrl:
          type: string
        streamKey:
          type: string
          description: Pass empty string to clear the stored key.
        creditMinutesPerNewPlayer:
          type: integer
          minimum: 0
          maximum: 1440
          description: "Host service credit policy. When > 0, this host extends short-term in-game credit to new players who run out of LZT mid-session, up to this many minutes of play. Set to 0 to disable."
        creditMaxLztPerPlayer:
          type: integer
          minimum: 0
          description: |
            Maximum LZT this host will credit to any single borrower. Acts as a
            per-borrower cap on host service credit.

    UpdateHostPcSpecsBody:
      type: object
      properties:
        hostToken:
          type: string
          description: Fallback when Authorization Bearer header is absent
        gpu:
          type: string
          maxLength: 256
        cpu:
          type: string
          maxLength: 256
        ramGb:
          type: integer
          minimum: 0
          maximum: 65536
      required: [gpu, cpu, ramGb]

    HostDebtorsResponse:
      type: object
      properties:
        debtors:
          type: array
          items:
            type: object
            properties:
              loanId:
                type: string
              playerId:
                type: string
              playerDisplayName:
                type: ["string", "null"]
              principalLzt:
                type: integer
              outstandingLzt:
                type: integer
              repaidLzt:
                type: integer
              status:
                type: string
              startedAt:
                type: string
                format: date-time
              dueAt:
                type: string
                format: date-time
        totalOutstandingLzt:
          type: integer
      required: [debtors, totalOutstandingLzt]

    HostStreamRelayResponse:
      type: object
      properties:
        streamPlatform:
          type: string
        streamUrl:
          type: string
        streamKey:
          type: string
      required: [streamPlatform, streamUrl, streamKey]

    SteamAutoHostableBody:
      type: object
      properties:
        hostToken:
          type: string
        steamGames:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            properties:
              appId:
                type: string
                pattern: "^\\d+$"
              name:
                type: string
              bestExePath:
                type: ["string", "null"]
            required: [appId, name]
      required: [steamGames]

    SteamAutoHostableResponse:
      type: object
      properties:
        eligible:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: string
              title:
                type: string
              coverImageUrl:
                type: string
              appPath:
                type: ["string", "null"]
              tier:
                type: string
              steamAppId:
                type: string
            required: [gameId, title, coverImageUrl, tier, steamAppId]
        skipped:
          type: array
          items:
            type: object
            properties:
              appId:
                type: string
              name:
                type: string
              reason:
                type: string
            required: [appId, name, reason]
      required: [eligible, skipped]

    BulkPublishLibraryBody:
      type: object
      properties:
        hostToken:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              gameId:
                type: string
                format: uuid
              appPath:
                type: string
              pricePerMinuteLzt:
                type: integer
                minimum: 0
            required: [gameId]
      required: [items]

    BulkPublishLibraryResponse:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        updated:
          type: array
          items:
            type: string
        total:
          type: integer
      required: [added, updated, total]

    Player:
      type: object
      properties:
        id:
          type: string
        playerToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: РЎРёРЅРёР№ вЂ” internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Р—РµР»С‘РЅС‹Р№ вЂ” LZT convertible back to crypto at 200:1
        isGuest:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - playerToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - createdAt
        - lastSeenAt

    RegisterHostBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    RegisterPlayerBody:
      type: object
      properties:
        displayName:
          type: string
        guest:
          type: boolean
          description: When true, creates an anonymous guest wallet without displayName

    UpgradeGuestPlayerBody:
      type: object
      properties:
        guestToken:
          type: string
        displayName:
          type: string
          minLength: 2
          maxLength: 32
      required:
        - guestToken
        - displayName

    AuthLoginBody:
      type: object
      properties:
        legacyToken:
          type: string
      required:
        - legacyToken

    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresInSec:
          type: integer
      required:
        - accessToken
        - expiresInSec

    RenewSessionBlockBody:
      type: object
      properties:
        playerWalletToken:
          type: string
        blockMinutes:
          type: integer
          enum: [10, 15, 25]
      required:
        - playerWalletToken
        - blockMinutes

    RateSessionBody:
      type: object
      properties:
        playerWalletToken:
          type: string
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required:
        - playerWalletToken
        - score

    RateSessionResponse:
      type: object
      properties:
        ratingAvg:
          type: number
        ratingCount:
          type: integer
      required:
        - ratingAvg
        - ratingCount

    PlatformEvent:
      type: object
      description: Platform-wide notification payload delivered over SSE.
      properties:
        type:
          type: string
          description: Event type (e.g. connected, host_last_seen)
        payload:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time
      required:
        - type
        - payload
        - at

    RawgSearchResultItem:
      type: object
      properties:
        rawgId:
          type: string
        title:
          type: string
        coverImageUrl:
          type: ["string", "null"]
        genres:
          type: array
          items:
            type: string
        rating:
          type: ["number", "null"]
        metacritic:
          type: ["integer", "null"]
        steamAppId:
          type: string
          description: Present when source is steam fallback
        source:
          type: string
          enum: [rawg, steam]
      required:
        - rawgId
        - title
        - genres

    SteamLookupResult:
      type: object
      properties:
        steamAppId:
