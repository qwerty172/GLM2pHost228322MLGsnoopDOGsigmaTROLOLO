          type: ["integer", "null"]
        escrowRemainingLzt:
          type: ["integer", "null"]
        sponsorHostPerMinuteLzt:
          type: ["integer", "null"]
        sponsorPlayerPerMinuteLzt:
          type: ["integer", "null"]
        royaltyBasis:
          type: ["string", "null"]
        royaltyValue:
          type: ["integer", "null"]
        royaltySource:
          type: ["string", "null"]
        minGpuVram:
          type: ["integer", "null"]
          description: Minimum GPU VRAM in GB (null = no requirement)
        minCpuCores:
          type: ["integer", "null"]
          description: Minimum CPU core count (null = no requirement)
        minRamGb:
          type: ["integer", "null"]
          description: Minimum RAM in GB (null = no requirement)
        minDownloadMbps:
          type: ["integer", "null"]
          description: Minimum download bandwidth in Mbps (null = no requirement)
        minUploadMbps:
          type: ["integer", "null"]
          description: Minimum upload bandwidth in Mbps (null = no requirement)
        recGpuVram:
          type: ["integer", "null"]
          description: Recommended GPU VRAM in GB (null = no recommended tier)
        recCpuCores:
          type: ["integer", "null"]
          description: Recommended CPU core count (null = no recommended tier)
        recRamGb:
          type: ["integer", "null"]
          description: Recommended RAM in GB (null = no recommended tier)
        recDownloadMbps:
          type: ["integer", "null"]
          description: Recommended download bandwidth in Mbps (null = no recommended tier)
        recUploadMbps:
          type: ["integer", "null"]
          description: Recommended upload bandwidth in Mbps (null = no recommended tier)
        requiredTier:
          type: string
          enum: [min, recommended]
          description: "min = host just needs to clear min*; recommended = host must also clear every rec* threshold"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - ownerType
        - ownerId
