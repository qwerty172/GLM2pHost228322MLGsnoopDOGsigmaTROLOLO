openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: P2P Cloud Gaming signaling and session management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: hosts
    description: Host registration and management
  - name: sessions
    description: Session lifecycle and discovery
  - name: wallet
    description: Crypto wallet, balances, deposits, withdrawals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /hosts/register:
    post:
      operationId: registerHost
      tags: [hosts]
      summary: Register a new host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterHostBody"
      responses:
        "201":
          description: Host registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"

  /hosts/{hostToken}:
    get:
      operationId: getHost
      tags: [hosts]
      summary: Look up host by token
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/sessions:
    get:
      operationId: listHostSessions
      tags: [hosts]
      summary: List sessions for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/stats:
    get:
      operationId: getHostStats
      tags: [hosts]
      summary: Aggregate stats for a host (sessions, minutes streamed, earnings)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStats"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/activity:
    get:
      operationId: getHostActivity
      tags: [hosts]
      summary: Recent activity feed for a host (sessions started/ended, payouts)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}:
    get:
      operationId: getSessionByPlayerToken
      tags: [sessions]
      summary: Get a session by its player token (used by player share link)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/end:
    patch:
      operationId: endSession
      tags: [sessions]
      summary: End an active session (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionBody"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{hostToken}:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Wallet overview — balance, deposit addresses, withdrawal history
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{hostToken}/withdraw:
    post:
      operationId: requestWithdrawal
      tags: [wallet]
      summary: Submit a withdrawal request (queued for processing by wallet worker)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWithdrawalBody"
      responses:
        "201":
          description: Withdrawal queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid request (e.g. insufficient balance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Host:
      type: object
      properties:
        id:
          type: string
        hostToken:
          type: string
        displayName:
          type: string
        creditBalance:
          type: number
          description: Available credit balance in USD-equivalent
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - hostToken
        - displayName
        - creditBalance
        - createdAt
        - lastSeenAt

    RegisterHostBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    Session:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        playerToken:
          type: string
        appName:
          type: string
        status:
          type: string
          description: One of pending, active, ended
        resolution:
          type: string
        bitrateKbps:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - hostId
        - playerToken
        - appName
        - status
        - resolution
        - bitrateKbps
        - createdAt

    EndSessionBody:
      type: object
      properties:
        hostToken:
          type: string
      required:
        - hostToken

    CreateSessionBody:
      type: object
      properties:
        hostToken:
          type: string
        appName:
          type: string
        resolution:
          type: string
        bitrateKbps:
          type: integer
      required:
        - hostToken
        - appName

    HostStats:
      type: object
      properties:
        totalSessions:
          type: integer
        activeSessions:
          type: integer
        totalMinutesStreamed:
          type: integer
        lifetimeEarnings:
          type: number
        earnings7d:
          type: number
        creditBalance:
          type: number
      required:
        - totalSessions
        - activeSessions
        - totalMinutesStreamed
        - lifetimeEarnings
        - earnings7d
        - creditBalance

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          description: "session_started | session_ended | withdrawal_requested | withdrawal_completed | deposit_received"
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - kind
        - title
        - timestamp

    DepositAddress:
      type: object
      properties:
        currency:
          type: string
          description: "USDT_TRC20 | NANO | SOL"
        label:
          type: string
        address:
          type: string
        network:
          type: string
        minDeposit:
          type: number
      required:
        - currency
        - label
        - address
        - network
        - minDeposit

    Withdrawal:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        currency:
          type: string
        address:
          type: string
        amount:
          type: number
        status:
          type: string
          description: "pending | processing | completed | failed"
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - hostId
        - currency
        - address
        - amount
        - status
        - requestedAt

    RequestWithdrawalBody:
      type: object
      properties:
        currency:
          type: string
        address:
          type: string
        amount:
          type: number
      required:
        - currency
        - address
        - amount

    Wallet:
      type: object
      properties:
        creditBalance:
          type: number
        pendingWithdrawals:
          type: number
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        recentWithdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
      required:
        - creditBalance
        - pendingWithdrawals
        - depositAddresses
        - recentWithdrawals
