      tags: [auth]
      summary: Bind an Ed25519 public key to a host account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostToken, pubkey, challenge, signature]
              properties:
                hostToken:
                  type: string
                pubkey:
                  type: string
                  description: Hex-encoded Ed25519 SubjectPublicKeyInfo
                challenge:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Key bound
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "400":
          description: Invalid challenge or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Different key already bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/agent-login:
    post:
      operationId: agentLogin
      tags: [auth]
      summary: Verify agent signature and return hostToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, challenge, signature]
              properties:
                pubkey:
                  type: string
                challenge:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [hostToken]
                properties:
                  hostToken:
                    type: string
        "400":
          description: Invalid challenge or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No host bound to this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

