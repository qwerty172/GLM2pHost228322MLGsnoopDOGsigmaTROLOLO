      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expiresAt]
                properties:
                  challenge:
                    type: string
                  expiresAt:
                    type: integer
                    description: Unix epoch ms when the challenge expires

