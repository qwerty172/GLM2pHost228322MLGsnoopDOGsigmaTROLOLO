          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - borrowerType
        - borrowerId
        - amountLzt
        - termDays
        - rateBps
        - status
        - fundedAmountLzt
        - fundedLoanId
        - createdAt
        - updatedAt

