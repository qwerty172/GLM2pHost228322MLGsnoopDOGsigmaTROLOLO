openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: P2P Cloud Gaming signaling, session, and wallet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: hosts
    description: Host registration and management
  - name: players
    description: Player registration and wallet identity
  - name: sessions
    description: Session lifecycle and discovery
  - name: wallet
    description: Crypto wallet, balances, deposits, withdrawals
  - name: games
    description: Catalog of games available to stream
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /hosts/register:
    post:
      operationId: registerHost
      tags: [hosts]
      summary: Register a new host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterHostBody"
      responses:
        "201":
          description: Host registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"

  /hosts/{hostToken}:
    get:
      operationId: getHost
      tags: [hosts]
      summary: Look up host by token
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/config:
    patch:
      operationId: updateHostConfig
      tags: [hosts]
      summary: Update the host's offer config (binding, pricing, schedule, restream)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostConfigBody"
      responses:
        "200":
          description: Updated host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/sessions:
    get:
      operationId: listHostSessions
      tags: [hosts]
      summary: List sessions for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/stats:
    get:
      operationId: getHostStats
      tags: [hosts]
      summary: Aggregate stats for a host (sessions, minutes streamed, earnings)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStats"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/activity:
    get:
      operationId: getHostActivity
      tags: [hosts]
      summary: Recent activity feed for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts:
    get:
      operationId: listPublicHosts
      tags: [hosts]
      summary: Public list of currently-available hosts
      description: Returns hosts that have an open session and are within their availability schedule. Safe for anonymous visitors — never exposes hostToken or wallet/balance.
      responses:
        "200":
          description: Live hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHostListItem"

  /stats:
    get:
      operationId: getPublicStats
      tags: [health]
      summary: Public platform stats for the landing page
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /players/register:
    post:
      operationId: registerPlayer
      tags: [players]
      summary: Register a new player wallet identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerBody"
      responses:
        "201":
          description: Player registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{playerToken}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Look up player by token
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the games catalog with live-session counts
      parameters:
        - in: query
          name: hasMods
          required: false
          schema:
            type: boolean
          description: Only return games tagged as supporting mods
        - in: query
          name: isMultiplayer
          required: false
          schema:
            type: boolean
          description: Only return multiplayer games
        - in: query
          name: hostSpectatesPlayer
          required: false
          schema:
            type: boolean
          description: Only return games where the host watches the player's session
        - in: query
          name: hasQuests
          required: false
          schema:
            type: boolean
          description: Only return games that support paid quests
        - in: query
          name: liveOnly
          required: false
          schema:
            type: boolean
          description: Only return games that have at least one live session right now
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against the game title
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: Only return games that have at least one currently-available host whose capability tags contain this value (case-insensitive).
      responses:
        "200":
          description: Games catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameListItem"

  /games/{slug}:
    get:
      operationId: getGameBySlug
      tags: [games]
      summary: Game detail with currently-live sessions
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: When set, only live hosts whose capability tags contain this value are returned.
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetail"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}:
    get:
      operationId: getSessionByPlayerToken
      tags: [sessions]
      summary: Get a session by its player token (used by player share link)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}/claim:
    post:
      operationId: claimSession
      tags: [sessions]
      summary: Claim a session by linking it to a player's wallet (enables billing)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSessionBody"
      responses:
        "200":
          description: Session claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request (insufficient balance, already claimed, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/end:
    patch:
      operationId: endSession
      tags: [sessions]
      summary: End an active session (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndSessionBody"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Wallet overview — balance, deposit addresses, withdrawal history
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
          description: Either a host token or a player token
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: Recent wallet transactions (deposits, withdrawals, billing)
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/{userToken}/withdraw:
    post:
      operationId: requestWithdrawal
      tags: [wallet]
      summary: Submit a withdrawal request (queued for processing)
      parameters:
        - in: path
          name: userToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestWithdrawalBody"
      responses:
        "201":
          description: Withdrawal queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "400":
          description: Invalid request (e.g. insufficient balance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ScheduleSlot:
      type: object
      description: A single weekly availability window (UTC).
      properties:
        day:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday … 6 = Saturday
        startMin:
          type: integer
          minimum: 0
          maximum: 1440
        endMin:
          type: integer
          minimum: 0
          maximum: 1440
      required:
        - day
        - startMin
        - endMin

    Host:
      type: object
      properties:
        id:
          type: string
        hostToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: Синий — internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Зелёный — LZT convertible back to crypto at 200:1
        gameId:
          type: ["string", "null"]
          description: Catalog game this host is bound to
        boundAppPath:
          type: string
          description: Absolute Windows path to the .exe the agent will launch
        boundUrl:
          type: string
          description: URL of a browser game the agent will open. When set, takes precedence over boundAppPath.
        boundAppLabel:
          type: string
          description: Friendly label shown in the games library
        description:
          type: string
        tags:
          type: array
          items:
            type: string
          description: Capability tags shown as badges and used as library filters
        launchPriceUsd:
          type: number
          description: Charged once when a player joins (may be negative)
        minutePriceUsd:
          type: number
          description: Charged per minute while streaming (may be negative)
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
          description: e.g. "twitch", "youtube", "rtmp"
        streamUrl:
          type: string
        streamKeySet:
          type: boolean
          description: True if a stream key is stored. The key itself is never returned.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - hostToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - gameId
        - boundAppPath
        - boundUrl
        - boundAppLabel
        - description
        - tags
        - launchPriceUsd
        - minutePriceUsd
        - scheduleMode
        - scheduleJson
        - streamPlatform
        - streamUrl
        - streamKeySet
        - createdAt
        - lastSeenAt

    UpdateHostConfigBody:
      type: object
      description: Partial update — omit a field to leave it unchanged.
      properties:
        gameId:
          type: ["string", "null"]
        boundAppPath:
          type: string
        boundUrl:
          type: string
          description: URL of a browser game; mutually exclusive with boundAppPath at runtime.
        boundAppLabel:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
        streamUrl:
          type: string
        streamKey:
          type: string
          description: Pass empty string to clear the stored key.

    Player:
      type: object
      properties:
        id:
          type: string
        playerToken:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
          description: Синий — internal LZT, cannot be withdrawn
        withdrawableBalanceLzt:
          type: integer
          description: Зелёный — LZT convertible back to crypto at 200:1
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - playerToken
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - createdAt
        - lastSeenAt

    RegisterHostBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    RegisterPlayerBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    GameListItem:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        coverImageUrl:
          type: string
        description:
          type: string
        genre:
          type: string
        hasMods:
          type: boolean
        isMultiplayer:
          type: boolean
        hostSpectatesPlayer:
          type: boolean
        hasQuests:
          type: boolean
        liveSessionCount:
          type: integer
          description: Number of pending or active sessions matching this game right now
      required:
        - id
        - slug
        - title
        - coverImageUrl
        - description
        - genre
        - hasMods
        - isMultiplayer
        - hostSpectatesPlayer
        - hasQuests
        - liveSessionCount

    GameLiveSession:
      type: object
      properties:
        playerToken:
          type: string
          description: Player share token — visit /play/{playerToken} to join
        appName:
          type: string
        ratePerMinute:
          type: number
        resolution:
          type: string
        bitrateKbps:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        hostDisplayName:
          type: string
        boundAppLabel:
          type: string
        boundUrl:
          type: string
          description: When set, the agent opens this URL instead of launching an .exe.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        scheduleMode:
          type: string
          enum: [always, scheduled]
        scheduleJson:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        streamPlatform:
          type: string
      required:
        - playerToken
        - appName
        - ratePerMinute
        - resolution
        - bitrateKbps
        - status
        - createdAt
        - hostDisplayName
        - boundAppLabel
        - boundUrl
        - description
        - tags
        - launchPriceUsd
        - minutePriceUsd
        - scheduleMode
        - scheduleJson
        - streamPlatform

    GameDetail:
      allOf:
        - $ref: "#/components/schemas/GameListItem"
        - type: object
          properties:
            liveSessions:
              type: array
              items:
                $ref: "#/components/schemas/GameLiveSession"
          required:
            - liveSessions

    Session:
      type: object
      properties:
        id:
          type: string
        hostId:
          type: string
        playerToken:
          type: string
        claimedByPlayerId:
          type: ["string", "null"]
        appName:
          type: string
        status:
          type: string
          description: One of pending, active, ended
        resolution:
          type: string
        bitrateKbps:
          type: integer
        ratePerMinute:
          type: number
          description: Player credits charged per minute (host receives net of commission)
        paymentSource:
          type: string
          enum: [blue, green, auto]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - hostId
        - playerToken
        - appName
        - status
        - resolution
        - bitrateKbps
        - ratePerMinute
        - createdAt

    EndSessionBody:
      type: object
      properties:
        hostToken:
          type: string
      required:
        - hostToken

    ClaimSessionBody:
      type: object
      properties:
        playerWalletToken:
          type: string
          description: The player's wallet token (issued via /players/register)
        paymentSource:
          type: string
          enum: [blue, green, auto]
          description: |
            Which LZT bucket the player wants to pay from. "auto" prefers
            зелёный (withdrawable) and falls back to синий (internal).
      required:
        - playerWalletToken

    CreateSessionBody:
      type: object
      properties:
        hostToken:
          type: string
        appName:
          type: string
        resolution:
          type: string
        bitrateKbps:
          type: integer
        ratePerMinute:
          type: number
        paymentSource:
          type: string
          enum: [blue, green, auto]
      required:
        - hostToken
        - appName

    HostStats:
      type: object
      properties:
        totalSessions:
          type: integer
        activeSessions:
          type: integer
        totalMinutesStreamed:
          type: integer
        lifetimeEarnings:
          type: number
        earnings7d:
          type: number
        internalBalanceLzt:
          type: integer
        withdrawableBalanceLzt:
          type: integer
      required:
        - totalSessions
        - activeSessions
        - totalMinutesStreamed
        - lifetimeEarnings
        - earnings7d
        - internalBalanceLzt
        - withdrawableBalanceLzt

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - kind
        - title
        - timestamp

    DepositAddress:
      type: object
      properties:
        currency:
          type: string
          description: "USDT_TRC20 | NANO | SOL"
        label:
          type: string
        address:
          type: string
        network:
          type: string
        minDeposit:
          type: number
      required:
        - currency
        - label
        - address
        - network
        - minDeposit

    Withdrawal:
      type: object
      properties:
        id:
          type: string
        ownerType:
          type: string
        ownerId:
          type: string
        currency:
          type: string
        address:
          type: string
        amountUsdt:
          type: number
          description: Amount in crypto USDT-equivalent (LZT / 200)
        amountLzt:
          type: integer
        status:
          type: string
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - ownerType
        - ownerId
        - currency
        - address
        - amountUsdt
        - amountLzt
        - status
        - requestedAt

    RequestWithdrawalBody:
      type: object
      properties:
        currency:
          type: string
        address:
          type: string
        amountLzt:
          type: integer
          description: Amount in LZT (must be a multiple of 200 — i.e. whole USDT)
      required:
        - currency
        - address
        - amountLzt

    Wallet:
      type: object
      properties:
        ownerType:
          type: string
          description: "host | player"
        ownerId:
          type: string
        displayName:
          type: string
        internalBalanceLzt:
          type: integer
        withdrawableBalanceLzt:
          type: integer
        pendingWithdrawalsLzt:
          type: integer
        lztPerUsdt:
          type: integer
        depositAddresses:
          type: array
          items:
            $ref: "#/components/schemas/DepositAddress"
        recentWithdrawals:
          type: array
          items:
            $ref: "#/components/schemas/Withdrawal"
      required:
        - ownerType
        - ownerId
        - displayName
        - internalBalanceLzt
        - withdrawableBalanceLzt
        - pendingWithdrawalsLzt
        - lztPerUsdt
        - depositAddresses
        - recentWithdrawals

    PublicHostListItem:
      type: object
      description: Anonymous-safe view of a live host
      properties:
        id:
          type: string
        displayName:
          type: string
        boundAppLabel:
          type: string
        boundUrlHost:
          type: string
          description: Hostname of the boundUrl (e.g. "shellshock.io"), empty for native-app hosts.
        tags:
          type: array
          items:
            type: string
        pricePerHourUsd:
          type: number
          description: minutePriceUsd * 60
        launchPriceUsd:
          type: number
        minutePriceUsd:
          type: number
        status:
          type: string
          description: "online | offline | scheduled"
        playerToken:
          type: string
          description: Share token so anonymous visitors can join the open session.
      required:
        - id
        - displayName
        - boundAppLabel
        - boundUrlHost
        - tags
        - pricePerHourUsd
        - launchPriceUsd
        - minutePriceUsd
        - status
        - playerToken

    PublicStats:
      type: object
      properties:
        hostsOnline:
          type: integer
        activeSessions:
          type: integer
        totalPaidOutCents:
          type: integer
          description: Sum of completed host withdrawals in USD cents.
      required:
        - hostsOnline
        - activeSessions
        - totalPaidOutCents

    WalletTransaction:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          description: "deposit | withdrawal | session_billing"
        currency:
          type: ["string", "null"]
        amountLzt:
          type: integer
          description: Signed LZT (negative for debits, positive for credits)
        status:
          type: ["string", "null"]
        description:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - kind
        - amountLzt
        - description
        - timestamp
