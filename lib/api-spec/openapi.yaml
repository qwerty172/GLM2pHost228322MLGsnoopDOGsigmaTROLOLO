          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: JWT not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

