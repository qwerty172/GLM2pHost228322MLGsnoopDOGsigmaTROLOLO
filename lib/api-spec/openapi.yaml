    post:
      operationId: issueAgentBindCode
      tags: [auth]
      summary: Issue a short-lived bind code for pairing the desktop agent
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: Bearer host token
      responses:
        "200":
          description: Bind code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueAgentBindCodeResponse"
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Exchange a legacy host/player token for a short-lived JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginBody"
      responses:
        "200":
          description: Access token issued; refresh token set as httpOnly cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
