openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: P2P Cloud Gaming signaling, session, and wallet API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: downloads
    description: Host-agent distribution downloads
  - name: hosts
    description: Host registration and management
  - name: players
    description: Player registration and wallet identity
  - name: sessions
    description: Session lifecycle and discovery
  - name: wallet
    description: Crypto wallet, balances, deposits, withdrawals
  - name: games
    description: Catalog of games available to stream
  - name: quotas
    description: Quota preset-contracts (royalty / sponsor) attachable to sessions
  - name: loans
    description: P2P loan marketplace (request, fund, repay)
  - name: public
    description: Public catalog, preview, and ICE helpers
  - name: embed
    description: Embeddable widget sessions funded by developer API keys
  - name: auth
    description: Host-agent Ed25519 challenge / bind / login
  - name: dev
    description: Developer API keys for embed integrations
  - name: storage
    description: Object storage upload URLs and public assets
  - name: events
    description: Real-time platform notifications (Server-Sent Events)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /downloads/host-agent.zip:
    get:
      operationId: downloadHostAgentZip
      tags: [downloads]
      summary: Download portable host-agent bundle (ZIP)
      description: >
        Streams a ZIP with dist, src, configs, generated start.bat and INSTALL.txt
        for Windows hosts. No authentication required.
      responses:
        "200":
          description: Host agent ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "503":
          description: Bundle unavailable (agent directory missing or dist not built)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Archiver error while building ZIP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /downloads/host-agent.exe:
    get:
      operationId: downloadHostAgentExe
      tags: [downloads]
      summary: Redirect to host-agent Windows installer
      description: >
        Redirects to HOST_AGENT_EXE_URL when configured; otherwise returns 503
        with instructions to use the ZIP download.
      responses:
        "302":
          description: Redirect to external installer URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        "503":
          description: Installer not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/stream:
    get:
      operationId: streamPlatformEvents
      tags: [events]
      summary: Server-Sent Events stream of platform notifications
      description: >
        Long-lived SSE connection fanning out Postgres NOTIFY payloads to all
        connected clients. Sends an initial `connected` event on connect, then
        `: keepalive` comment lines every 25 seconds. Clients should reconnect
        automatically on disconnect (browser EventSource does this by default).
      responses:
        "200":
          description: Open event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Each SSE `data:` line contains a JSON-encoded PlatformEvent.
              examples:
                connected:
                  summary: Initial connection handshake
                  value: |
                    data: {"type":"connected","payload":{},"at":"2026-08-03T12:00:00.000Z"}

  /hosts/register:
    post:
      operationId: registerHost
      tags: [hosts]
      summary: Register a new host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterHostBody"
      responses:
        "201":
          description: Host registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"

  /hosts/{hostToken}:
    get:
      operationId: getHost
      tags: [hosts]
      summary: Look up host by token
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/config:
    patch:
      operationId: updateHostConfig
      tags: [hosts]
      summary: Update the host's offer config (binding, pricing, schedule, restream)
      description: >
        Authenticate with Authorization Bearer, X-Host-Token, or X-User-Token
        (host token). Do not put the host token in the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostConfigBody"
      responses:
        "200":
          description: Updated host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/config:
    patch:
      operationId: updateHostConfigLegacy
      tags: [hosts]
      summary: "[Legacy] Update host config — prefer PATCH /hosts/me/config"
      description: >
        Legacy path. Header auth (Authorization Bearer / X-Host-Token) is required
        and must match the path hostToken.
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHostConfigBody"
      responses:
        "200":
          description: Updated host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/debtors:
    get:
      operationId: getHostDebtors
      tags: [hosts]
      summary: List players who owe this host (negative balance loans)
      description: Authenticate with Authorization Bearer / X-Host-Token / X-User-Token.
      responses:
        "200":
          description: Debtors list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/debtors:
    get:
      operationId: getHostDebtorsLegacy
      tags: [hosts]
      summary: "[Legacy] List host debtors — prefer GET /hosts/me/debtors"
      description: >
        Legacy path. Header auth (Authorization Bearer / X-Host-Token) is required
        and must match the path hostToken.
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Debtors list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDebtorsResponse"
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/me/stream-relay:
    get:
      operationId: getHostStreamRelay
      tags: [hosts]
      summary: RTMP restream credentials for the authenticated host
      description: Authenticate with Authorization Bearer / X-Host-Token / X-User-Token.
      responses:
        "200":
          description: Stream relay config
          content:
            application/json:
              schema:
                type: object
                properties:
                  streamPlatform:
                    type: string
                  streamUrl:
                    type: string
                  streamKey:
                    type: string
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/stream-relay:
    get:
      operationId: getHostStreamRelayLegacy
      tags: [hosts]
      summary: "[Legacy] RTMP restream credentials — prefer GET /hosts/me/stream-relay"
      description: >
        Legacy path. X-Host-Token / Bearer header is required and must match the path hostToken.
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream relay config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStreamRelayResponse"
        "401":
          description: Host auth required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Stream relay not configured or host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Encryption unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/sessions:
    get:
      operationId: listHostSessions
      tags: [hosts]
      summary: List sessions for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/stats:
    get:
      operationId: getHostStats
      tags: [hosts]
      summary: Aggregate stats for a host (sessions, minutes streamed, earnings)
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Host stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostStats"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/activity:
    get:
      operationId: getHostActivity
      tags: [hosts]
      summary: Recent activity feed for a host
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts/{hostToken}/agent-events:
    get:
      operationId: getHostAgentEvents
      tags: [hosts]
      summary: Recent telemetry events reported by the host agent
      parameters:
        - in: path
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEventItem"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hosts:
    get:
      operationId: listPublicHosts
      tags: [hosts]
      summary: Public list of currently-available hosts
      description: Returns hosts that have an open session and are within their availability schedule. Safe for anonymous visitors вЂ” never exposes hostToken or wallet/balance.
      responses:
        "200":
          description: Live hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHostListItem"

  /stats:
    get:
      operationId: getPublicStats
      tags: [health]
      summary: Public platform stats for the landing page
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /players/register:
    post:
      operationId: registerPlayer
      tags: [players]
      summary: Register a new player wallet identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPlayerBody"
      responses:
        "201":
          description: Player registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/upgrade-guest:
    post:
      operationId: upgradeGuestPlayer
      tags: [players]
      summary: Upgrade a guest wallet to a full account with a display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeGuestPlayerBody"
      responses:
        "200":
          description: Upgraded player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Guest not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{playerToken}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Look up player by token
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List the games catalog with live-session counts
      parameters:
        - in: query
          name: hasMods
          required: false
          schema:
            type: boolean
          description: Only return games tagged as supporting mods
        - in: query
          name: isMultiplayer
          required: false
          schema:
            type: boolean
          description: Only return multiplayer games
        - in: query
          name: hostSpectatesPlayer
          required: false
          schema:
            type: boolean
          description: Only return games where the host watches the player's session
        - in: query
          name: hasQuests
          required: false
          schema:
            type: boolean
          description: Only return games that support paid quests
        - in: query
          name: liveOnly
          required: false
          schema:
            type: boolean
          description: Only return games that have at least one live session right now
        - in: query
          name: vdsOnly
          required: false
          schema:
            type: boolean
          description: Only return games that have at least one always-on VDS host
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against the game title
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: Only return games that have at least one currently-available host whose capability tags contain this value (case-insensitive).
        - in: query
          name: includeHidden
          required: false
          schema:
            type: boolean
          description: When true and the caller is an admin (X-Host-Token), hidden games are included in the results.
      responses:
        "200":
          description: Games catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameListItem"

  /games/{slug}:
    get:
      operationId: getGameBySlug
      tags: [games]
      summary: Game detail with currently-live sessions
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: When set, only live hosts whose capability tags contain this value are returned.
      responses:
        "200":
          description: Game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetail"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/rawg-search:
    get:
      operationId: rawgSearch
      tags: [games]
      summary: Search games by title (RAWG API or Steam Store fallback)
      description: >
        Returns up to 6 game suggestions with cover art and metadata.
        Uses RAWG when RAWG_API_KEY is configured; otherwise falls back to
        Steam Store Search (no API key required).
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Search query (2–100 characters)
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RawgSearchResultItem"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream game search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/steam-lookup:
    get:
      operationId: steamLookup
      tags: [games]
      summary: Fetch Steam Store metadata and current player count for an app ID
      parameters:
        - in: query
          name: appId
          required: true
          schema:
            type: string
            pattern: "^\\d{1,10}$"
      responses:
        "200":
          description: Steam metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteamLookupResult"
        "400":
          description: Invalid appId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Steam lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions:
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Host not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/browser-host:
    post:
      operationId: createBrowserHostSession
      tags: [sessions]
      summary: |
        Create a session whose host is the calling browser (no desktop agent).
        Returns both the session and the freshly minted hostToken вЂ” the caller
        is responsible for storing the hostToken locally and using it to
        connect to /signal as role=host and to end the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrowserHostSessionBody"
      responses:
        "201":
          description: Browser-host session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBrowserHostSessionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Game or player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session by id (host-authenticated)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: hostToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}:
    get:
      operationId: getSessionByPlayerToken
      tags: [sessions]
      summary: Get a session by its player token (used by player share link)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{id}/rate:
    post:
      operationId: rateSession
      tags: [sessions]
      summary: Submit a post-session rating for the host
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateSessionBody"
      responses:
        "200":
          description: Rating recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateSessionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the session player can rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-invite/{inviteCode}:
    get:
      operationId: getSessionByInvite
      tags: [sessions]
      summary: Resolve a public invite code to session details (player play link)
      parameters:
        - in: path
          name: inviteCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session resolved from invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionByInviteResponse"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Invite expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/test:
    post:
      operationId: createTestSession
      tags: [sessions]
      summary: Create a free host self-test session
      parameters:
        - in: header
          name: X-Host-Token
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrideUrl:
                  type: string
                  description: One-shot browser URL override for this test
      responses:
        "201":
          description: Test session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTestSessionResponse"
        "401":
          description: Missing host token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Host busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}/claim:
    post:
      operationId: claimSession
      tags: [sessions]
      summary: Claim a session by linking it to a player's wallet (enables billing)
      parameters:
        - in: path
          name: playerToken
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimSessionBody"
      responses:
        "200":
          description: Session claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request (insufficient balance, already claimed, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/by-player-token/{playerToken}/renew-block:
    post:
