        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: JWT not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

