        - sponsorHostPerMinuteLzt
        - sponsorPlayerPerMinuteLzt
        - royaltyBasis
        - royaltyValue
        - royaltySource
        - minGpuVram
        - minCpuCores
        - minRamGb
        - minDownloadMbps
        - minUploadMbps
        - recGpuVram
        - recCpuCores
        - recRamGb
        - recDownloadMbps
        - recUploadMbps
        - requiredTier
        - createdAt
        - updatedAt

