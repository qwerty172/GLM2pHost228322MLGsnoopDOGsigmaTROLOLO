# coturn TURN/STUN server configuration for DecentralHub
# See: https://github.com/coturn/coturn/wiki/turnserver

listening-port=3478
tls-listening-port=5349

# Time-limited credentials via shared secret (HMAC-SHA1).
# API server generates username=<expiry>:<userId> and credential=HMAC(secret, username).
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET

# Relay address — set to your server's public IP in production.
# relay-ip=YOUR_PUBLIC_IP
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP

fingerprint
lt-cred-mech

# Disable local host candidates in relay responses for cleaner ICE.
no-multicast-peers

# Logging
log-file=stdout
verbose

# Quotas (adjust for production)
max-bps=0
bps-capacity=0
