name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: decentralhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d decentralhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/decentralhub_test
      RATE_LIMIT_STORAGE: memory
      PORT: "5000"
      BASE_PATH: /

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (api-server)
        run: pnpm --filter @workspace/api-server test

      - name: Unit tests (host-agent)
        run: pnpm --filter @workspace/host-agent test

      - name: Build api-server
        run: pnpm --filter @workspace/api-server build

      - name: Build web
        run: pnpm --filter @workspace/web exec vite build --config vite.config.ts
