name: Host Agent Build

on:
  push:
    branches: [main]
    tags: ["host-agent-v*"]
    paths:
      - "artifacts/host-agent/**"
      - ".github/workflows/agent-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm --filter @workspace/host-agent run package:win

      - name: Upload installer artifact
        if: "!startsWith(github.ref, 'refs/tags/host-agent-v')"
        uses: actions/upload-artifact@v4
        with:
          name: host-agent-installer
          path: artifacts/host-agent/release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/host-agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/host-agent/release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
